    title: string
    creationDate: date-time
    expectedPaymentDate: date-time
    externalId: string (client-supplied external identifier)
    amountAllTaxesIncluded: decimal
    amountWithoutTaxes: decimal
  note: >-
    A freelancer's invoice to a client. Carries no explicit currency field of its own — currency
    appears only on PaymentResource — so an invoice amount is unlabelled in the contract.
- name: FeeInvoiceResource
  domain: billing
  addressable: true
  id_field: id
  operations:
  - findFeeInvoices
  - getFeeInvoice
  - getFeeInvoicePdf
  required:
  - id
  - title
  - amountAllTaxesIncluded
  - amountWithoutTaxes
  - taxes
  - customer
  - supplier
  note: >-
    Malt's own service charge billed to the freelancer — the platform's take, exposed as a
    first-class invoice object. Structurally identical to InvoiceResource minus creationDate and
    expectedPaymentDate, which means a fee invoice carries NO DATE FIELD AT ALL even though it is
    retrieved by a since/until date range.
- name: PaymentResource
  domain: billing
  addressable: false
  id_field: id
  addressable_note: >-
    Payments have an id but no GET /freelancer/payments/{id} operation — they are list-only.
  operations:
  - findPayments
  required:
  - id
  - date
  - amount
  - currency
  - invoices
  fields:
    id: string
    date: date-time
    amount: decimal
    currency: string (currency code)
    wireRef: string (wire transfer reference)
- name: LightInvoiceResource
  domain: billing
  addressable: false
  kind: reference-object
  fields:
    id: string
    externalId: string
    type: LightInvoiceType (enum-ish string)
  note: >-
    The join object between a Payment and the invoices it settles. Its `type` discriminates
    invoice kind (invoice vs fee invoice), which is the only place in the model where the two
    invoice families are unified.
- name: PDFInvoiceResource
  domain: billing
  addressable: false
  kind: representation
  fields:
    id: string
    pdf: base64-encoded PDF content (format byte)
  note: >-
    The "PDF" operations return this JSON wrapper with the document base64-encoded in a `pdf`
    field, declared as application/json — not a binary application/pdf stream. A client must
    decode rather than stream, so large invoice sets are memory-expensive.
