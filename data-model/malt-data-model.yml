graph_findings:
- kind: disjoint-graphs
  detail: >-
    The billing and identity graphs share no edge. There is no field on a SCIM UserResource that
    resolves to a SupplierResource or CustomerResource, and no field on an invoice that resolves
    to a SCIM user id. Two products, one host.
- kind: unaddressable-parties
  detail: >-
    CustomerResource and SupplierResource have no `id` and no operations of their own. There is no
    way to list a freelancer's clients, or to fetch one, or to join two invoices to the same
    company except by comparing name / registrationNumber / vatNumber strings.
- kind: no-currency-on-invoices
  detail: >-
    Amounts on InvoiceResource and FeeInvoiceResource carry no currency field. Currency appears
    only on PaymentResource. A cross-border freelancer reading only invoices cannot tell the
    denomination from the contract.
- kind: fee-invoice-has-no-date
  detail: >-
    FeeInvoiceResource omits creationDate and expectedPaymentDate even though findFeeInvoices
    filters on a since/until date range. The field the query filters on is not returned.
- kind: payments-not-addressable
  detail: >-
    PaymentResource has an id but no single-fetch operation, so a payment id captured from a list
    response cannot be re-resolved later.
