note: >-
  Two disjoint entity graphs share one host. The billing graph is a conventional
  invoice/payment/party model: an Invoice belongs to a Customer and a Supplier and carries Taxes;
  a Payment settles one or more Invoices through a light reference. The SCIM graph is the RFC 7643
  User model with a Malt extension. Nothing links the two — a SCIM User is not connected to an
  Invoice's Supplier or Customer in the contract, even though in the product they describe the
  same people and companies. Worth recording: the party objects (CustomerResource,
  SupplierResource) are INLINE VALUE OBJECTS with no `id` field of their own, so a client cannot
  address a customer or supplier as a resource, cannot list them, and cannot join across invoices
  except by string-matching the name and registration/VAT numbers.
