format: spring-boot-error-map
rfc9457: false
note: >-
  Malt publishes no error reference page and no error-code registry. This catalog is derived from
  the 4xx responses declared on each operation in the OpenAPI plus the two worked examples (401,
  403) in the API guidelines prose. Three findings matter for anyone integrating.
  (1) Not one 4xx response in the spec declares a response body — every error response has a
  description string and an empty `content`, so a generated client gets no error type at all.
  (2) An `ErrorResponse` schema IS defined in components.schemas but no operation references it;
  it is dead weight in the document.
  (3) Live behaviour is thinner than the docs: an unauthenticated request to either surface
  returns 401 with content-length: 0, so the documented timestamp/status/error/path envelope did
  not materialise on the wire. There are no application-level error codes anywhere — a client
  discriminates failures by HTTP status alone.
