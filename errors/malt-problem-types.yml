- status: 403
  title: Deletion forbidden
  cause: >-
    A SCIM user cannot be deleted — the spec's description notes this happens "for instance
    because the user has activity" on the platform.
  remediation: >-
    Deactivate instead of deleting: PATCH /scim/v2/Users/{userId} setting `active` to false, which
    is the only PATCH operation Malt currently accepts.
  body: undeclared
  source_operations:
  - openapi/malt-exposed-apis-openapi.yml#deleteUser
- status: 404
  title: Invoice not found
  cause: No invoice exists with the supplied id, or it belongs to another identity.
  remediation: >-
    Confirm the id came from a findInvoices / findFeeInvoices response for the same token. Note
    Malt does not distinguish "does not exist" from "not yours" — both surface as 404.
