gaps:
- kind: no-429
  detail: >-
    No operation declares a 429 response, and no rate-limit headers are returned, despite the
    guidelines promising a rate-limiting section. A client cannot handle throttling deliberately.
- kind: no-5xx
  detail: >-
    No operation declares any 5xx response. A generated client has no typed path for a server
    failure.
- kind: no-error-bodies
  detail: >-
    All 15 declared 4xx responses have empty `content`. Error handling must be written against
    status codes and prose, not against the contract.
- kind: no-scim-error-shape
  detail: >-
    SCIM 2.0 defines its own error response format (schemas urn:ietf:params:scim:api:messages:2.0:Error
    with scimType/detail/status). Malt's SCIM operations declare no error bodies at all, so the
    SCIM error contract a standards-conformant client expects is not published.
- kind: no-error-codes
  detail: >-
    There is no application error code namespace of any kind — no string codes, no numeric
    registry, no error reference page.
