- status: 403
  title: Forbidden - insufficient permissions
  cause: >-
    The token is valid but its identity or permission scopes do not cover the requested resource.
    Because Malt's model is identity-based (freelancer / client team / organization token), a
    403 commonly means the wrong TOKEN TYPE was used rather than a missing scope.
  remediation: >-
    Confirm the token type matches the surface — freelancer tokens for /freelancer/*, organization
    tokens for /scim/v2/* — and that the required permission scopes were selected when the token
    was created.
  body: undeclared in spec; documented example is the Spring error map.
