divergence_finding: >-
  The interesting gap at Malt is not between REST, GraphQL and MCP — only REST exists. It is
  between the API and the platform. Malt's product is talent discovery and freelance engagement:
  search profiles, read availability and rates, send and manage project offers, run missions. Not
  one of those capabilities appears in the published contract, which covers only downstream
  billing artifacts (invoices, service charges, payments) and enterprise user provisioning (SCIM).
  Two independent community MCP servers were built by scraping the web app to reach the
  profile/mission surface, and a small industry of third-party scrapers (Apify actors, Parse.bot
  endpoints) sells Malt profile and search data. That is the divergence worth recording: the
  demand is on the marketplace core, and the contract is on the back office.
