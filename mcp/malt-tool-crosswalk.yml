  This crosswalk is unusual and the shape matters. Malt publishes NO MCP server and NO GraphQL
  endpoint, so there is no live tool surface to bind. What it maps instead is the CANDIDATE tool
  set derived from Malt's own OpenAPI (mcp/malt-mcp.yml) against the operations that back it —
  a 1:1 binding at confidence high, because every candidate tool was generated from exactly one
  published operationId. There are no mcp_only rows: nothing is exposed to agents that is not in
  the REST contract, because nothing is exposed to agents at all. There are no rest_only rows
  either: every one of the 13 operations has a candidate tool. The real divergence at Malt is not
  between surfaces — it is between what the API exposes and what agents actually want from the
  platform, which is recorded in divergence_finding below.
