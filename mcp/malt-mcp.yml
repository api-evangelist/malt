note: >-
  Malt ships NO MCP server. There is no hosted endpoint, no first-party stdio package, and no
  mention of MCP, agents or tools anywhere in the API guidelines at api.malt.com. Probes for
  https://api.malt.com/mcp return 404 and no mcp.malt.com host exists. The tools below are a
  CANDIDATE surface derived one-to-one from the 13 operations in Malt's published OpenAPI — they
  describe what an MCP server over this API would expose, not something a client can call today.
  Third-party community servers DO exist (see third_party below) but they are not Malt's, they
  drive the web app by browser automation rather than the documented API, and their own authors
  warn they may violate Malt's terms of service — so they are recorded as context and are not the
  subject of this manifest.
