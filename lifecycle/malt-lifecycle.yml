  scim_path_version: v2
  scim_note: >-
    /scim/v2/ is the SCIM 2.0 protocol version required by RFC 7644, not evidence of a Malt
    versioning scheme.
  freelancer_surface_versioned: false
  finding: >-
    A published document whose info.version is 0.0.1, describing endpoints in production behind a
    credential wall, is a signal in itself: the contract is treated as pre-release even though the
    API is live.
