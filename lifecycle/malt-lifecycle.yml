  http_status_note: >-
    status.malt.com sits behind the same Cloudflare bot challenge as www.malt.com and answers 403
    to a plain client; it resolves and renders for a browser-shaped fetch, which is how it was
    confirmed as a StatusCake public report for Malt.
  rss: null
