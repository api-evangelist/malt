method: searched
source: >-
  https://api.malt.com/ (API guidelines), https://status.malt.com/,
  openapi/malt-exposed-apis-openapi.yml
note: >-
  Malt runs a public status page but publishes NO API lifecycle policy of any kind. There is no
  versioning policy, no deprecation policy, no sunset commitment, no SLA and no changelog for the
  API. The only version signal in the whole surface is the SCIM path segment /scim/v2/, which is
  mandated by RFC 7644 rather than chosen by Malt, and the OpenAPI document's own info.version,
  which reads "0.0.1". The /freelancer/* endpoints are entirely unversioned, so there is no
  mechanism by which Malt could introduce a breaking change without breaking live callers.
