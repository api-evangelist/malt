  finding: >-
    The status page is a StatusCake public uptime report rather than a full incident-communication
    surface. No RSS/Atom feed, no status API endpoint, and no per-component breakdown was
    exposed, so a machine cannot subscribe to Malt's availability — only a human can look at it.
    It is also unclear whether api.malt.com is among the monitored endpoints.
