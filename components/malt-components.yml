note: >-
  Malt publishes "Joy", its internal design system, as public npm packages under the @maltjoy
  scope. These are genuine client-side UI components — Stencil-compiled custom elements with a
  `joy-` tag prefix — not embeddable surfaces for the Malt API. There is no Malt-hosted embedded
  widget, no iframe/Elements-style checkout or dashboard component, and no client-side JS that
  talks to api.malt.com. Recorded here because the component library is real, first-party and
  publicly installable; a developer integrating the Malt API gets no UI layer from it.
  The design system source repository (gitlab.com/maltcommunity/apps/design-system) is private —
  it redirects to a GitLab SAML SSO login — so the component list below was derived from the
  published package's own file tree, not from documentation.
