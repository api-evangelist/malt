note: >-
  Malt names three company-side plans on its pricing page and attaches a feature list to each,
  but publishes NO price for any of them — every tier reads "On demand" and routes the buyer to a
  contact form or a demo request. There is no self-serve price, no listed commission or service-fee
  percentage, and no published overage schedule. The page states the platform is free for
  freelancers, but does not state the service charge Malt deducts from freelancer earnings (the
  API exposes those deductions as "fee invoices" / service charge invoices via
  GET /freelancer/fee-invoices, so the mechanism is documented even though the rate is not).
  Recorded as plan_count: 3 with null prices — the tiers are real and published; the amounts are
  not. API access is not a pricing-page line item on any tier.
api_access_in_plans: false
api_access_note: >-
  None of the three tiers mentions API access. The API documentation says freelancer tokens are
  self-served from My Account > API Keys, while client team and organization tokens come "from
  your Malt representative" — so the enterprise half of the API surface (SCIM provisioning) is
  effectively sales-gated rather than plan-gated.
