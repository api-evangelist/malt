generated: '2026-08-17'
method: searched
source: >-
  registry.npmjs.org (search + per-package metadata endpoints), pypi.org/pypi/<name>/json,
  api.github.com/orgs/Maltcommunity, plus the Malt API documentation at https://api.malt.com/
note: >-
  IMPORTANT FINDING — Malt publishes NO first-party API client library in any language. The
  api.malt.com documentation offers only raw cURL and fetch() examples; there is no SDK link,
  no code-generation download, and no `malt` / `@malt/*` client package on npm, PyPI, RubyGems,
  Maven Central, NuGet, crates.io or pkg.go.dev. The packages recorded below ARE first-party
  Malt code — the `@maltjoy` design system, published under the `@malt` npm scope by Malt
  engineers (maintainers `malt-ops`, `achilleguillon_malt`, `preynaudmalt`, `victorgarciamalt`,
  `kevin_carnaille`) from gitlab.com/maltcommunity/apps/design-system — but they are UI/design
  packages, not clients for the Malt API. No `SDKs` pointer is emitted in apis.yml for that
  reason: crediting a CSS/token library as an API SDK would misstate what a developer gets.
  Registry versions and dates below are read from registry.npmjs.org metadata.
api_client_libraries:
  count: 0
  languages: []
  finding: >-
    A consumer of the Malt Exposed APIs writes their own HTTP client. For the SCIM 2.0 half of
    the surface this matters less — any standards-compliant SCIM client library works against
    /scim/v2/Users — but the freelancer billing endpoints have no generated or hand-written
    client of any kind.
  searched_registries:
  - npm
  - pypi
  - rubygems
  - maven-central
  - nuget
  - crates.io
  - pkg.go.dev
  - packagist
