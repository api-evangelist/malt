  types:
  - apiKey
  - http
  api_key_in:
  - header
  oauth2_flows: []
  oauth2: false
  oidc: false
  mutual_tls: false
  header: Authorization
  prefix: none (bare token, per Malt's documented examples)
  token_lifetime: long-lived (no expiry documented, no refresh mechanism)
  rotation: manual (the docs advise rotating tokens regularly; no API for it)
