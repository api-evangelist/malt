- name: ApiKeyAuth
  type: apiKey
  in: header
  parameter: Authorization
  description: >-
    To obtain an access token, please follow the instructions at https://api.malt.com
  applied_to_operations: 6
  applied_note: The six SCIM operations under /scim/v2/Users.
  sources:
  - openapi/malt-exposed-apis-openapi.yml
token_types:
- name: Freelancer account token
  audience: individual freelancer
  self_serve: true
  obtain: >-
    Create an identity at https://www.malt.com/signup, then generate the token at
    https://www.malt.com/account/tokens (My Account > API Keys), selecting the permission scopes.
  scopes: >-
    The token-creation UI offers "related permission scopes" per Malt's own instructions, but the
    scope names are not published anywhere public and no oauth2 scope map exists in the spec — so
    the scope vocabulary is only visible to a signed-in account holder. No scopes/ artifact is
    emitted for that reason.
  covers:
  - /freelancer/invoices
  - /freelancer/invoices/{id}
  - /freelancer/invoices/{id}/pdf
  - /freelancer/payments
  - /freelancer/fee-invoices
  - /freelancer/fee-invoices/{id}
  - /freelancer/fee-invoices/{id}/pdf
- name: Client team token
  audience: a buying team inside a client company
  self_serve: false
  obtain: Contact your Malt representative.
- name: Organization token
  audience: an enterprise organization
  self_serve: false
  obtain: Contact your Malt representative.
  covers:
  - /scim/v2/Users
  - /scim/v2/Users/{userId}
authorization_model:
  kind: identity-based
  detail: >-
    Malt's own wording: "APIs are accessible with a given identity based scope at malt." The token's
    identity — freelancer, client team, or organization — determines what is visible, rather than a
    scope string presented per request. A practical consequence: a 403 from this API most often
    means the WRONG TOKEN TYPE was used, not a missing scope.
token_handling:
  displayed_once: true
  displayed_once_note: >-
    Malt's instructions state the token "will only be accessible at the moment you see it" — capture
    it at creation.
  published_guidance:
  - Never expose your token in client-side code
  - Store tokens securely
  - Rotate tokens regularly
  - Monitor token usage in your API dashboard
  guidance_gap: >-
    The guidance refers to monitoring "token usage in your API dashboard", but no such dashboard is
    documented or linked anywhere in the public surface.
discovery:
