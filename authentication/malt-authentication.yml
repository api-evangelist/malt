docs: https://api.malt.com/
note: >-
  Baseline derived mechanically from the OpenAPI securitySchemes, then upgraded from Malt's own
  published authentication guidance (the long info.description on the unified spec, which is the
  entirety of Malt's API documentation). Two findings a client must know before writing code.
  (1) The documented header form is a BARE token — `Authorization: your-api-token-here` — with no
  `Bearer ` prefix, even though the spec also declares an http/bearer scheme with bearerFormat JWT.
  The prose and the spec disagree; the prose plus the worked cURL and JavaScript examples all show
  the bare form, so that is what to send. (2) The declared BearerAuth scheme is applied to NO
  operation, the document's global `security` is an EMPTY ARRAY, and the seven /freelancer/*
  operations declare no security requirement at all — yet a live unauthenticated call to
  /freelancer/invoices returns 401. The contract understates its own auth requirement; only the six
  SCIM operations reference ApiKeyAuth.
