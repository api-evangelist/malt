  oauth_protected_resource: 404 at https://api.malt.com/.well-known/oauth-protected-resource
  openid_configuration: 404 at https://api.malt.com/.well-known/openid-configuration
  finding: >-
    No machine-readable auth discovery of any kind. An agent cannot negotiate credentials; a human
    must obtain a token out of band.
