apis:
- name: Malt Exposed APIs
  description: >-
    Malt's publicly documented API surface, served from api.malt.com and documented with Stoplight Elements against a
    single unified OpenAPI 3.0.3 document ("Malt - API Guidelines", 13 operations). Two capability groups: a
    freelancer billing surface (list and retrieve invoices, service charge / fee invoices and payments over a date
    range, plus invoice PDF retrieval) and a SCIM 2.0 /scim/v2/Users endpoint for enterprise user provisioning
    (create, read, query, replace, patch-deactivate, delete). Authentication is a bearer/opaque token passed in the
    Authorization header; freelancer tokens are self-served from My Account > API Keys, while organization and client
    team tokens are obtained through a Malt representative.
  humanURL: https://api.malt.com/
  baseURL: https://api.malt.com
