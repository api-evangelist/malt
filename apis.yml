aid: malt
name: Malt
description: >-
  Malt is a European freelance marketplace and Freelance Management System (FMS) founded in 2013 in Paris by Vincent
  Huguet and Hugo Lassiege, connecting more than a million independent consultants across tech, data, AI, design,
  marketing and management with enterprise buyers. Beyond matching, the platform handles the administrative spine of
  freelance engagement: quotes, automated contracts and NDAs, timesheets, invoicing, insured payments and compliance
  checks, plus an enterprise tier that consolidates an existing freelance roster (Malt Open) and plugs into 85+ ERP,
  procurement and HR systems including SAP Fieldglass, Coupa and Workday. Malt publishes a small, credential-gated
  public API surface at api.malt.com documented with Stoplight Elements: a freelancer billing API (invoices, service
  charge invoices, payments, invoice PDFs) and a SCIM 2.0 user-provisioning endpoint for enterprise identity
  lifecycle management.
